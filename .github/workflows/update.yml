name: Aggiorna dati Game Pass

on:
  schedule:
    # Una volta al giorno, per ridurre al minimo l'impronta verso il sito
    # sorgente e non rischiare di essere segnalati come traffico automatico.
    - cron: '0 6 * * *'
  # Permette anche di far partire l'aggiornamento manualmente dal sito
  # GitHub, ma usalo con parsimonia: troppe esecuzioni ravvicinate
  # possono far scattare i sistemi anti-bot del sito sorgente.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il repository
        uses: actions/checkout@v4

      - name: Imposta Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installa le dipendenze
        run: pip install requests beautifulsoup4

      - name: Esegui lo script di aggiornamento
        run: python scraper.py

      - name: Salva il file aggiornato nel repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add upcoming_data.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Aggiornamento automatico dati Game Pass"
          git pull --rebase origin main
          git push
